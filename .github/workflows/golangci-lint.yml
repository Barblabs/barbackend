name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version-file: go.mod
          # See test.yml for why the Go cache is managed by hand.
          cache: false
      - name: restore go cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      # Pinned in tools.mod, so CI and local runs use the same linter version.
      - name: golangci-lint
        run: go tool -modfile=tools.mod golangci-lint run ./...
      - name: save go cache
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}
