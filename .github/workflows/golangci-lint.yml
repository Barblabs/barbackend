name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools.sum
      # Pinned in tools.mod, so CI and local runs use the same linter version.
      - name: golangci-lint
        run: go tool -modfile=tools.mod golangci-lint run ./...
