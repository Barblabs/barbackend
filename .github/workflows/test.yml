name: test
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # The workflow file keys a separate cache per workflow: they build
          # different things, and with a shared key whichever workflow saves
          # first leaves the other compiling from scratch on every run.
          cache-dependency-path: |
            go.sum
            tools.sum
            .github/workflows/test.yml
      # Pinned in tools.mod, so CI and local runs use the same sqlc version.
      - name: check sqlc output is up to date
        run: go tool -modfile=tools.mod sqlc diff
      # pgtest downloads and extracts the Postgres binaries on first start; they
      # only change with the embedded-postgres module or the pinned version.
      - name: cache embedded postgres
        uses: actions/cache@v6
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('go.sum', 'internal/postgres/pgtest/pgtest.go') }}
      - name: go test
        run: go test -race ./...
