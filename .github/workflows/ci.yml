name: ci
on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - &setup-go
        uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version-file: go.mod
          # setup-go keys its cache on go.sum, so it is saved once and then hit
          # forever. Go trims build cache entries unused for 5 days, so a frozen
          # cache ends up deleted on restore and every run compiles from scratch.
          cache: false
      - &restore-go-cache
        name: restore go cache
        uses: actions/cache/restore@v6
        with:
          path: &go-cache-path |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: &go-cache-key go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      - name: golangci-lint
        run: go tool -modfile=tools.mod golangci-lint run ./...
      - name: check sqlc output is up to date
        run: go tool -modfile=tools.mod sqlc diff
      # Without -test, so code only tests reach is reported. deadcode exits 0
      # either way, so the step fails on any line outside the test-helper
      # packages, which only tests are meant to reach.
      - name: deadcode
        shell: bash
        run: |
          dead=$(go tool -modfile=tools.mod deadcode ./... | { grep -Ev '^internal/[^:]*test/[^/:]+:' || true; })
          if [ -n "$dead" ]; then echo "$dead"; exit 1; fi
      - &save-go-cache
        name: save go cache
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v6
        with:
          path: *go-cache-path
          key: *go-cache-key

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - *setup-go
      - *restore-go-cache
      - name: cache embedded postgres
        uses: actions/cache@v6
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('go.sum', 'internal/postgres/pgtest/pgtest.go') }}
          # Any go.sum change moves the key, and a cold cache downloads the
          # binaries from Maven Central, which fails intermittently. Most key
          # changes keep the same Postgres version, so the old cache still works.
          restore-keys: embedded-postgres-${{ runner.os }}-
      - name: go test
        run: go test -race ./...
      - *save-go-cache

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: setup-buildx
      # cache-to: type=gha keeps image layers but not RUN --mount=type=cache
      # contents, so go build compiled every package from scratch. The cache
      # dance copies the mounts into the builder and back out in its post step,
      # which runs before the post step of the actions/cache above it. Only
      # pushes to the default branch save, so that step is skipped elsewhere.
      - name: restore image go cache
        if: github.event_name != 'push' || github.ref_name != github.event.repository.default_branch
        uses: actions/cache/restore@v6
        with:
          path: &image-go-cache-path |
            go-mod-cache
            go-build-cache
          key: &image-go-cache-key go-image-${{ hashFiles('Dockerfile') }}-${{ github.sha }}
          restore-keys: &image-go-cache-restore-keys go-image-${{ hashFiles('Dockerfile') }}-
      - name: restore and save image go cache
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache@v6
        with:
          path: *image-go-cache-path
          key: *image-go-cache-key
          restore-keys: *image-go-cache-restore-keys
      - name: inject image go cache
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "go-mod-cache": "/go/pkg/mod",
              "go-build-cache": "/root/.cache/go-build"
            }
          skip-extraction: ${{ github.event_name != 'push' || github.ref_name != github.event.repository.default_branch }}
      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Pull requests build only arm64, the platform production runs, so
          # the two builds do not share the runner's CPUs.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/arm64' || 'linux/amd64,linux/arm64' }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every push to the default branch saves new Go caches under its SHA. Left
  # alone they fill the repository's 10 GB, and GitHub then evicts other
  # caches, such as the embedded Postgres one. Keep only the newest of each.
  prune-caches:
    name: prune caches
    needs: [lint, test, image]
    if: always() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REF: refs/heads/${{ github.ref_name }}
    steps:
      - name: delete all but the newest go cache of each job
        shell: bash
        run: |
          for prefix in go-lint- go-test- go-image-; do
            gh cache list --ref "$REF" --key "$prefix" --sort created_at --order desc --limit 100 \
              --json id --jq '.[1:][].id' | xargs -r -n1 gh cache delete
          done

  deploy:
    name: deploy
    needs: [lint, test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    # Queue instead of cancel: killing a deploy mid-migrate is worse than waiting.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_NAME: ${{ vars.INSTANCE_NAME }}
      SHA: ${{ github.sha }}
    steps:
      # Unset variables resolve to empty strings. Fail here with the full list
      # instead of halfway through a deploy.
      - name: check production environment variables
        shell: bash
        run: |
          missing=()
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY INSTANCE_NAME; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing variables on the 'production' environment: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      # The repository's tags are immutable, so a re-run for a SHA already
      # pushed skips the build and deploys the image that is there.
      - name: check image in ecr
        id: ecr
        shell: bash
        run: |
          if out=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids "imageTag=$SHA" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$ECR_REPOSITORY:$SHA already pushed"
          elif grep -q ImageNotFoundException <<<"$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi
      - if: steps.ecr.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build and push image
        if: steps.ecr.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Polls instead of `aws ssm wait command-executed`, which gives up after
      # about 100 s: an image pull plus migrate can take longer.
      - name: run barbackend-deploy on the instance
        timeout-minutes: 15
        shell: bash
        run: |
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=$INSTANCE_NAME" \
            --parameters "commands=[\"barbackend-deploy $SHA\"]" \
            --comment "barbackend $SHA" \
            --query Command.CommandId --output text)
          echo "command $command_id"

          instance_id=""
          for _ in $(seq 30); do
            instance_id=$(aws ssm list-command-invocations --command-id "$command_id" \
              --query 'CommandInvocations[0].InstanceId' --output text)
            if [ -n "$instance_id" ] && [ "$instance_id" != None ]; then break; fi
            instance_id=""
            sleep 2
          done
          if [ -z "$instance_id" ]; then
            echo "::error::No instance tagged Name=$INSTANCE_NAME picked up command $command_id"
            exit 1
          fi
          echo "instance $instance_id"

          invocation() {
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
              --query "$1" --output text
          }
          while :; do
            status=$(invocation Status 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          invocation StandardOutputContent
          invocation StandardErrorContent >&2
          if [ "$status" != Success ]; then
            echo "::error::barbackend-deploy $SHA ended with status $status"
            exit 1
          fi
