version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    # Package layering from ADR 0008. In lax mode the longest matching prefix
    # wins, so denying all of barbackend/internal and allowing specific layers
    # also forbids layers that do not exist yet.
    depguard:
      rules:
        inventory:
          list-mode: lax
          files:
            - "**/internal/inventory/**"
          allow:
            - barbackend/internal/inventory
          deny:
            - pkg: barbackend/internal
              desc: inventory is the pure domain and imports no other layer (ADR 0008)
            - pkg: net/http
              desc: inventory is the pure domain and does no I/O (ADR 0008)
            - pkg: database/sql
              desc: inventory is the pure domain and does no I/O (ADR 0008)
            - pkg: github.com/jackc/pgx
              desc: inventory is the pure domain and does no I/O (ADR 0008)
        scoring:
          list-mode: lax
          files:
            - "**/internal/scoring/**"
          allow:
            - barbackend/internal/inventory
            - barbackend/internal/scoring
          deny:
            - pkg: barbackend/internal
              desc: scoring is a pure domain package that imports only inventory (ADR 0008, ADR 0009)
            - pkg: net/http
              desc: scoring is pure and does no I/O (ADR 0009)
            - pkg: database/sql
              desc: scoring is pure and does no I/O (ADR 0009)
            - pkg: github.com/jackc/pgx
              desc: scoring is pure and does no I/O (ADR 0009)
        cmdb:
          list-mode: lax
          files:
            - "**/internal/cmdb/**"
          allow:
            - barbackend/internal/cmdb
            - barbackend/internal/inventory
          deny:
            - pkg: barbackend/internal
              desc: CMDB Provider adapters depend only on the seam and inventory, never on persistence or use cases (ADR 0008)
            - pkg: github.com/jackc/pgx
              desc: CMDB Provider adapters never touch the database (ADR 0008)
        postgres:
          list-mode: lax
          files:
            - "**/internal/postgres/**"
          allow:
            - barbackend/internal/inventory
            - barbackend/internal/postgres
          deny:
            - pkg: barbackend/internal
              desc: persistence depends only on inventory; use cases call it, not the reverse (ADR 0008)
        # Handlers reach persistence and adapters only through use cases, so
        # each new use-case package is added to allow when httpapi serves it.
        httpapi-imports:
          list-mode: lax
          files:
            - "**/internal/httpapi/**"
          allow:
            - barbackend/internal/httpapi
            - barbackend/internal/inventory
            - barbackend/internal/sources
          deny:
            - pkg: barbackend/internal
              desc: HTTP transport calls use cases, never persistence or adapters directly (ADR 0008)
        httpapi:
          files:
            - "**/internal/**"
            - "!**/internal/httpapi/**"
          deny:
            - pkg: barbackend/internal/httpapi
              desc: only cmd wires the HTTP API (ADR 0008)
        gin:
          files:
            - $all
            - "!**/cmd/**"
            - "!**/internal/httpapi/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: only cmd and internal/httpapi are HTTP transport (ADR 0008)

formatters:
  enable:
    - gci
    - gofmt
